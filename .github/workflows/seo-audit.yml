name: SEO Audit Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * 1'  # Every Monday at 06:00 AM IST (00:30 UTC)

permissions:
  contents: read

jobs:
  seo-audit:
    name: SEO Audit - ${{ matrix.site_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - site_name: bharat-connect
            url: https://www.bharat-connect.com/
          - site_name: shapoorji-pallonji
            url: https://www.shapoorjipallonji.com/
          - site_name: shapoorji-realestate
            url: https://shapoorjirealestate.com/
          - site_name: joyville
            url: https://www.joyvillehomes.com/
          - site_name: viceroy
            url: https://www.viceroyproperties.in/
          - site_name: bombaydc
            url: https://bombaydc.com/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run SEO Audit
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AUDIT_SITE: ${{ matrix.url }}
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: node --max-old-space-size=8192 seo_audit.js
