name: SEO Audit

on:
  schedule:
    - cron: "0 20 7 5 *"   # May 8 at 2:00 AM IST (UTC 20:30 on May 7)
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:

  audit-bharat-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Run SEO Audit - bharat-connect.com
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          AUDIT_SITE: "https://www.bharat-connect.com/"
        run: node seo_audit.js

