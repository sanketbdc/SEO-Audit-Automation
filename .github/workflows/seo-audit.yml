name: SEO Audit

on:
  schedule:
    - cron: "30 0 8 * *"   # 8th of every month at 6:00 AM IST (UTC+5:30 = 00:30 UTC)
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:

  audit-bharat-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: "18"
      - run: npm install
      - run: npx playwright install chromium --with-deps
      - name: Run SEO Audit - bharat-connect.com
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          AUDIT_SITE: "https://www.bharat-connect.com/"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: node --max-old-space-size=8192 seo_audit.js

