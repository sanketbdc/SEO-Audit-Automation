name: SEO Audit

on:
  schedule:
    - cron: "30 0 * * 1" # Every Monday at 06:00 AM IST (00:30 UTC)
  workflow_dispatch:

jobs:
  audit-bharat-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run SEO Audit - bharat-connect.com
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          AUDIT_SITE: "https://www.bharat-connect.com/"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: node --max-old-space-size=8192 seo_audit.js

